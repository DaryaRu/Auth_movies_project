services:
  postgres:
    image: postgres:17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-short-links-service:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: short-links-image
    env_file: .env
    working_dir: /app
    command: >
      sh -c "python3 src/apply_migrations.py && gunicorn src.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --forwarded-allow-ips='*' --timeout 120"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    build:
      context: ../../
      dockerfile: tests/functional/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: short-links-tests-image
    env_file: .env
    working_dir: /app
    ports:
      - "5679:5678"
    depends_on:
      test-short-links-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: sh /app/tests/functional/entrypoint.sh


volumes:
  short_links_pg_data: