[mypy]
python_version = 3.12

# Добавляем, чтобы mypy не падал на каждом импорте сторонних библиотек без типов (aiokafka, slowapi).
ignore_missing_imports = True

# Плагин pydantic.mypy убирает ложные ошибки на BaseSettings/BaseModel (mypy не
# видит, что поля читаются из env).
plugins = pydantic.mypy

exclude = migrations/

explicit_package_bases = True
mypy_path = .
