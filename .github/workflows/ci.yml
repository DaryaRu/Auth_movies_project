name: Movies project CI

# Запуск workflow на каждый пуш и на каждый pull request в main, а также вручную.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменяет предыдущий прогон на той же ветке/PR при новом пуше.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint with ruff
    # Используем runner внутри инфраструктуры github на базе ubuntu.
    runs-on: ubuntu-latest
    steps:
      # Клонируем репозиторий в рабочую директорию раннера.
      - uses: actions/checkout@v4

      # Ставим Python нужной версии.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Ставим ruff фиксированной версии, чтобы новый релиз ruff не сломал CI.
      - name: Install ruff
        run: pip install ruff==0.15.10

      # Запускаем проверку ruff всех сервисов.
      - name: Run ruff
        run: ruff check .

  # Строит матрицу mypy автоматически по расположению requirements.txt.
  build:
    name: Build mypy matrix
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: build-matrix
        run: echo "matrix=$(python3 .github/scripts/build_mypy_matrix.py)" >> "$GITHUB_OUTPUT"

  mypy:
    name: mypy check ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv вместо pip (умеет сам кэшировать скачанные пакеты между запусками).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ join(matrix.requirements, '\n') }}

      # pydantic ставим для mypy-плагина pydantic.mypy.
      # --system — ставим в Python из actions/setup-python, а не в venv
      # (uv по умолчанию требует активное virtualenv).
      - name: Install mypy and dependencies
        run: |
          uv pip install --system mypy pydantic
          for req in ${{ join(matrix.requirements, ' ') }}; do
            uv pip install --system -r "$req"
          done

      - name: Run mypy
        run: mypy ${{ matrix.path }}

  # Для запуска функциональных тестов используются имеющиеся команды из
  # Makefile (test-auth/test-movies/test-analytics).
  # Перед запуском предварительно для каждого сервиса создается свой .env
  # и генерируются ключи через `make keys`, где это необходимо.
  test-auth:
    name: Functional auth tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Generate RSA keys for JWT
        run: make keys

      - name: Create .env for auth functional tests
        run: cp auth/tests/functional/.env.example auth/tests/functional/.env

      - name: Run auth functional tests
        run: make test-auth

  test-movies:
    name: Functional movies tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for movies functional tests
        run: cp movies/tests/functional/.env.example movies/tests/functional/.env

      - name: Run movies functional tests
        run: make test-movies

  test-analytics:
    name: Functional analytics tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Generate RSA keys for JWT
        run: make keys

      - name: Create .env for analytics functional tests
        run: cp analytics/tests/functional/.env.example analytics/tests/functional/.env

      - name: Run analytics functional tests
        run: make test-analytics
