services:
  postgres:
    image: postgres:17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-db:
    image: postgres:17
    env_file: .env
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER:-postgres} -d ${AUTH_POSTGRES_DB:-auth_db}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  short-links-db:
    image: postgres:17
    environment:
      POSTGRES_DB: short_links
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d short_links"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: ../../../auth
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: auth-image
    env_file: .env
    environment:
      POSTGRES_HOST: ${AUTH_POSTGRES_HOST:-auth-db}
      POSTGRES_PORT: ${AUTH_POSTGRES_PORT:-5432}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ALGORITHM: RS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DEBUG: 1
      ENVIRONMENT: test
      SHORT_LINKS_API_URL: http://short-links-service:8000/api/v1
      INTERNAL_SERVICE_SECRET: service-secret

    command: >
      sh -c "alembic upgrade head && gunicorn src.main:app
      --workers 2
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --forwarded-allow-ips=*
      --timeout 120
      --error-logfile -"
    volumes:
      - ../../../private.pem:/app/keys/private.pem:ro
      - ../../../public.pem:/app/keys/public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      short-links-service:
        condition: service_healthy

  # чтобы notifications-service мог подключить producer при старте
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: functest0notif00000001

  short-links-service:
    build:
      context: ../../../short_links
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: short-links-service-image
    env_file: .env
    environment:
      POSTGRES_HOST: short-links-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: short_links
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      INTERNAL_SERVICE_SECRET: service-secret
      ALLOWED_REDIRECT_HOSTS: localhost,127.0.0.1,auth-service
    command: >
      sh -c "alembic upgrade head && gunicorn src.main:app
      --workers 2
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --forwarded-allow-ips=*
      --timeout 120"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      short-links-db:
        condition: service_healthy

  test-notifications-service:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: notifications-service-image
    env_file: .env
    environment:
      AUTH_API_URL: http://auth-service:8000/api/v1
      REDIS_HOST: redis
      REDIS_PORT: 6379
    working_dir: /app
    command: >
      sh -c "alembic upgrade head && gunicorn src.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --forwarded-allow-ips='*' --timeout 120"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  tests:
    build:
      context: ../../
      dockerfile: tests/functional/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: notifications-functional-tests-image
    env_file: .env
    working_dir: /app
    depends_on:
      test-notifications-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: sh /app/tests/functional/entrypoint.sh
