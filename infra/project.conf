server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    server_tokens off;

    # Используем встроенный DNS докера (127.0.0.11) и переменную в каждом
    # proxy_pass, чтобы резолвить хост при запросе, а не при старте nginx —
    # иначе nginx не запустится, если какой-то сервис сейчас не поднят.
    resolver 127.0.0.11 valid=10s;

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /media/;
        access_log off;
    }

    location /api/v1/ {
        set $auth auth-service:8000;
        proxy_pass http://$auth;
    }

    location /api/auth/openapi {
        set $auth auth-service:8000;
        proxy_pass http://$auth;
    }

    location /api/movies/openapi {
        set $movies movies-service:7000;
        proxy_pass http://$movies;
    }

    location /api/v1/films/ {
        set $movies movies-service:7000;
        proxy_pass http://$movies;
    }

    location /api/v1/genres/ {
        set $movies movies-service:7000;
        proxy_pass http://$movies;
    }

    location /api/v1/persons/ {
        set $movies movies-service:7000;
        proxy_pass http://$movies;
    }

    location /admin/ {
        set $admin movies-admin:8000;
        proxy_pass http://$admin;
    }

    location /api/v1/analytics/ {
        set $analytics analytics-service:6000;
        proxy_pass http://$analytics;
    }

    location /api/analytics/openapi {
        set $analytics analytics-service:6000;
        proxy_pass http://$analytics;
    }

    location /api/v1/user-actions/ {
        proxy_pass http://user-actions-service:5000;
    }

    location /api/user-actions/openapi {
        proxy_pass http://user-actions-service:5000;
    }

    location /tracers/ {
        set $jaeger jaeger-query:16686;
        proxy_pass http://$jaeger;
    }
}
