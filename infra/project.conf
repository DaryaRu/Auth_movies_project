server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    server_tokens off;

    # Используем встроенный DNS докера (127.0.0.11) и переменную в каждом
    # proxy_pass, чтобы резолвить хост при запросе, а не при старте nginx —
    # иначе nginx не запустится, если какой-то сервис сейчас не поднят.
    resolver 127.0.0.11 valid=10s;

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /media/;
        access_log off;
    }

    location /api/v1/resolve/ {
        set $short_links short-links-service:8000;
        proxy_pass http://$short_links;
    }

    location /api/v1/ {
        set $auth auth-service:8000;
        proxy_pass http://$auth;
    }

    location /api/auth/openapi {
        set $auth auth-service:8000;
        proxy_pass http://$auth;
    }

    location /api/movies/openapi {
        set $movies movies-service:7000;
        proxy_pass http://$movies;
    }

    location /api/v1/films/ {
        set $movies movies-service:7000;
        proxy_pass http://$movies;
    }

    location /api/v1/genres/ {
        set $movies movies-service:7000;
        proxy_pass http://$movies;
    }

    location /api/v1/persons/ {
        set $movies movies-service:7000;
        proxy_pass http://$movies;
    }

    location /admin/ {
        set $admin movies-admin:8000;
        proxy_pass http://$admin;
    }

    location /api/v1/analytics/ {
        set $analytics analytics-service:6000;
        proxy_pass http://$analytics;
    }

    location /api/analytics/openapi {
        set $analytics analytics-service:6000;
        proxy_pass http://$analytics;
    }

    location /api/v1/user-actions/ {
        set $user_actions user-actions-service:5000;
        proxy_pass http://$user_actions;
    }

    location /api/user-actions/openapi {
        set $user_actions user-actions-service:5000;
        proxy_pass http://$user_actions;
    }

    location /c/ {
        set $short_links short-links-service:8000;
        rewrite ^/c/(.+)$ /api/v1/resolve/$1 break;
        proxy_pass http://$short_links;
    }

    location /api/v1/short-links/ {
        set $short_links short-links-service:8000;
        proxy_pass http://$short_links;
    }

    # WebSocket для push-уведомлений
    location /api/v1/ws/ {
        set $ws_gateway ws-gateway:8000;
        proxy_pass http://$ws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/short-links/openapi {
        set $short_links short-links-service:8000;
        proxy_pass http://$short_links;
    }

    location /tracers/ {
        set $jaeger jaeger-query:16686;
        proxy_pass http://$jaeger;
    }
}
