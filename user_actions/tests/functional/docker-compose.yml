services:
  postgres:
    image: postgres:17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxclients 20000
      --timeout 300
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-actions-app:
    build:
      context: ../../..
      dockerfile: user_actions/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: user-actions-image
    env_file: .env
    working_dir: /app
    command: >
      sh -c "python3 src/apply_migrations.py && gunicorn src.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:6001 --forwarded-allow-ips='*' --timeout 120"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6001/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../../private.pem:/app/keys/private.pem:ro
      - ../../../public.pem:/app/keys/public.pem:ro

  tests:
    image: user-actions-image
    env_file: .env
    working_dir: /app
    volumes:
      - ../../../user_actions:/app/user_actions
      - ../../../private.pem:/app/keys/private.pem:ro
      - ../../../public.pem:/app/keys/public.pem:ro
    ports:
      - "5679:5678"
    depends_on:
      user-actions-app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: sh /app/user_actions/tests/functional/entrypoint.sh


volumes:
  user_actions_pg_data: